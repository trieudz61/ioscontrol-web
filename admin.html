<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IOSControl Admin</title><meta name="description" content="IOSControl admin portal for managing users, wallets, and license keys."><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--bg:#060713;--panel:rgba(18,22,38,.82);--line:rgba(255,255,255,.1);--text:#eef2ff;--muted:#8b92ad;--brand:#8b5cf6;--cyan:#22d3ee;--good:#34d399;--bad:#fb7185;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:radial-gradient(circle at 15% 0,rgba(139,92,246,.35),transparent 34%),radial-gradient(circle at 85% 0,rgba(34,211,238,.2),transparent 30%),var(--bg);color:var(--text);min-height:100vh}.hide{display:none!important}.wrap{max-width:1280px;margin:auto;padding:26px 18px 70px}.nav{position:sticky;top:0;z-index:5;background:rgba(6,7,19,.72);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.navin{max-width:1280px;margin:auto;padding:14px 18px;display:flex;gap:12px;align-items:center}.brand{font-weight:900;font-size:20px}.spacer{flex:1}.card{background:linear-gradient(180deg,var(--panel),rgba(10,12,24,.72));border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 90px rgba(0,0,0,.38)}.login{max-width:430px;margin:10vh auto;padding:26px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat{padding:18px}.k{color:var(--muted);font-size:12px;font-weight:800}.v{font-size:28px;font-weight:900;margin-top:6px}.panel{padding:18px;margin-top:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,select{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);border-radius:14px;padding:12px 13px;outline:none}.search{max-width:360px}.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:900;color:white;background:linear-gradient(135deg,var(--brand),#4f46e5);cursor:pointer}.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}.btn.good{background:linear-gradient(135deg,#10b981,#22c55e)}.btn.bad{background:linear-gradient(135deg,#fb7185,#f43f5e)}.btn.warn{background:linear-gradient(135deg,#f59e0b,#d97706)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:18px;margin-top:14px}table{width:max-content;min-width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900;background:rgba(255,255,255,.08)}.active{color:var(--good)}.disabled,.locked{color:var(--bad)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modal .card{width:min(960px,100%);padding:20px;max-height:calc(100vh - 36px);overflow:auto}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}.msg{min-height:22px;color:var(--muted);font-size:13px}.err{color:var(--bad)}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.navin{display:grid;grid-template-columns:1fr auto}.wrap{padding:16px 10px}.row>*{width:100%}.search{max-width:none}.btn{width:100%}}</style></head><body><nav class="nav"><div class="navin"><div class="brand">IOSControl Admin</div><div class="spacer"></div><button id="logout" class="btn ghost hide">Logout</button></div></nav><main class="wrap"><section id="loginBox" class="card login"><h1>Admin Login</h1><p class="k">Quản lý users, ví và license</p><input id="user" placeholder="admin" style="margin:12px 0"><input id="pass" type="password" placeholder="Password"><button id="loginBtn" class="btn" style="width:100%;margin-top:14px">Login</button><div id="loginMsg" class="msg"></div></section><section id="app" class="hide"><div class="grid"><div class="card stat"><div class="k">Users</div><div id="sUsers" class="v">0</div></div><div class="card stat"><div class="k">Page</div><div id="sPage" class="v">1</div></div><div class="card stat"><div class="k">Loaded</div><div id="sLoaded" class="v">0</div></div><div class="card stat"><div class="k">Mode</div><div class="v">Admin</div></div></div><div class="card panel"><div class="row"><input id="q" class="search" placeholder="Search user/email/name"><button id="searchBtn" class="btn">Search</button><button id="prev" class="btn ghost">Prev</button><button id="next" class="btn ghost">Next</button></div><div class="tablewrap"><table><thead><tr><th>User</th><th>Email</th><th>Name</th><th>Balance</th><th>Keys</th><th>Active</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody id="users"></tbody></table></div></div></section></main><div id="modal" class="modal"><div class="card"><div class="row"><h2 id="mTitle" style="margin:0 auto 0 0">User</h2><button id="close" class="btn ghost" style="width:auto">×</button></div><div id="detail"></div></div></div><script>const API='https://ioscontrol-worker.ioscontrol.workers.dev/portal';let token=localStorage.getItem('admin_token')||'',page=1,lastPages=1,currentUser=null;const $=id=>document.getElementById(id),money=n=>(n||0).toLocaleString('vi-VN')+'đ';async function api(p,o={}){const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;const r=await fetch(API+p,{...o,headers:{...h,...(o.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok||j.success===false)throw new Error(j.error||'Request failed');return j}function showApp(on){$('loginBox').classList.toggle('hide',on);$('app').classList.toggle('hide',!on);$('logout').classList.toggle('hide',!on)}async function login(){try{const j=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('pass').value})});token=j.token;localStorage.setItem('admin_token',token);showApp(true);loadUsers()}catch(e){$('loginMsg').className='msg err';$('loginMsg').textContent=e.message}}async function loadUsers(){const j=await api(`/api/admin/users?page=${page}&q=${encodeURIComponent($('q').value)}`);lastPages=j.pages;$('sUsers').textContent=j.total;$('sPage').textContent=j.page+'/'+j.pages;$('sLoaded').textContent=j.rows.length;$('users').innerHTML=j.rows.map(u=>`<tr><td><b>${u.username||'-'}</b><br><span class="k">${u.id}</span></td><td>${u.email||''}</td><td>${u.last_name||''} ${u.first_name||''}</td><td>${money(u.balance_vnd)}</td><td>${u.key_count||0}</td><td>${u.active_keys||0}</td><td><span class="pill ${u.status}">${u.status}</span></td><td>${u.created_at||''}</td><td><button class="btn ghost" onclick="openUser('${u.id}')">Manage</button></td></tr>`).join('')}async function openUser(id){currentUser=id;const j=await api('/api/admin/users/'+encodeURIComponent(id));$('modal').classList.add('show');$('mTitle').textContent=(j.user.username||j.user.email)+' · '+money(j.user.balance_vnd);$('detail').innerHTML=`<div class="cols"><div class="card panel"><h3>Wallet adjust</h3><input id="amt" type="number" placeholder="Amount VND (+/-)"><input id="note" placeholder="Note" style="margin-top:8px"><button class="btn good" onclick="adjustWallet()" style="margin-top:10px">Apply</button><button class="btn ${j.user.status==='active'?'bad':'good'}" onclick="setStatus('${j.user.status==='active'?'disabled':'active'}')" style="margin-top:10px">${j.user.status==='active'?'Disable':'Enable'} user</button></div><div class="card panel"><h3>Recent transactions</h3>${(j.transactions||[]).map(t=>`<p class="k">${t.created_at} · ${t.type} · ${money(t.amount_vnd)} · ${t.note||''}</p>`).join('')||'<p class="k">No tx</p>'}</div></div><h3>Licenses</h3><div class="tablewrap"><table><thead><tr><th>Key</th><th>Label</th><th>UDID</th><th>Expires</th><th>Status</th><th>Actions</th></tr></thead><tbody>${(j.licenses||[]).map(l=>`<tr><td><b>${l.license_key}</b></td><td>${l.label||''}</td><td>${l.udid||'-'}</td><td>${l.expires_at||''}</td><td><span class="pill ${l.status}">${l.status}</span></td><td><button class="btn warn" onclick="lockKey('${l.license_key}',${l.locked?0:1})">${l.locked?'Unlock':'Lock'}</button> <button class="btn ghost" onclick="unbindKey('${l.license_key}')">Unbind</button></td></tr>`).join('')}</tbody></table></div>`}async function adjustWallet(){await api('/api/admin/users/'+encodeURIComponent(currentUser)+'/wallet-adjust',{method:'POST',body:JSON.stringify({amount_vnd:Number($('amt').value),note:$('note').value})});await openUser(currentUser);await loadUsers()}async function setStatus(status){await api('/api/admin/users/'+encodeURIComponent(currentUser)+'/status',{method:'POST',body:JSON.stringify({status})});await openUser(currentUser);await loadUsers()}async function lockKey(k,locked){await api('/api/admin/licenses/'+encodeURIComponent(k)+'/lock',{method:'POST',body:JSON.stringify({locked:!!locked})});await openUser(currentUser)}async function unbindKey(k){if(confirm('Unbind '+k+'?')){await api('/api/admin/licenses/'+encodeURIComponent(k)+'/unbind',{method:'POST'});await openUser(currentUser)}}$('loginBtn').onclick=login;$('logout').onclick=()=>{localStorage.removeItem('admin_token');token='';showApp(false)};$('searchBtn').onclick=()=>{page=1;loadUsers()};$('prev').onclick=()=>{if(page>1){page--;loadUsers()}};$('next').onclick=()=>{if(page<lastPages){page++;loadUsers()}};$('close').onclick=()=>$('modal').classList.remove('show');if(token){api('/api/admin/me').then(()=>{showApp(true);loadUsers()}).catch(()=>showApp(false))}</script></body></html>
